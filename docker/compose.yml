services:
  splunk:
    # Pinned by digest as well as tag so the image can't be swapped under the tag.
    image: splunk/splunk:9.4.11@sha256:6a79a2772def4a024f4562b9223720517f5d906b4ea25d3a2b2f4cac6c10b969
    container_name: splunk-bots
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-changeme}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-00000000-0000-0000-0000-000000000000}
    ports:
      - "8000:8000"
      - "8088:8088"
      - "8089:8089"
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc

volumes:
  splunk-var:
  splunk-etc:
