name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Code scanning requires GitHub Advanced Security on private repos. The job
    # always runs (so the workflow badge reports passing), but the CodeQL steps
    # are gated on the repo being public and auto-enable once it flips.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false
      - id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/${{ github.repository }}" --jq .private)" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.visibility.outputs.private == 'false' }}
        uses: github/codeql-action/init@84498526a009a99c875e83ef4821a8ba52de7c22  # v3.25.5
        with:
          languages: ${{ matrix.language }}
      - if: ${{ steps.visibility.outputs.private == 'false' }}
        uses: github/codeql-action/analyze@84498526a009a99c875e83ef4821a8ba52de7c22  # v3.25.5
        with:
          category: "/language:${{ matrix.language }}"
