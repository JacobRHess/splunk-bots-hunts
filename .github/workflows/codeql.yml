name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Code scanning requires GitHub Advanced Security on private repos.
    # Auto-enables once this repo flips public.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: github/codeql-action/init@84498526a009a99c875e83ef4821a8ba52de7c22  # v3.25.5
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@84498526a009a99c875e83ef4821a8ba52de7c22  # v3.25.5
        with:
          category: "/language:${{ matrix.language }}"
