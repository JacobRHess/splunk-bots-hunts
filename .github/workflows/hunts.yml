name: hunts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPLUNK_PASSWORD: Chang3me!
      SPLUNK_HEC_TOKEN: "00000000-0000-0000-0000-000000000000"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Start Splunk
        run: docker compose -f docker/compose.yml up -d

      - name: Wait for Splunk + HEC
        run: |
          for i in $(seq 1 90); do
            mgmt_ok=$(curl -k -s -o /dev/null -w '%{http_code}' "https://localhost:8089/services/server/info" -u "admin:${SPLUNK_PASSWORD}" || true)
            hec_ok=$(curl -k -s -o /dev/null -w '%{http_code}' "https://localhost:8088/services/collector/health" || true)
            if [ "$mgmt_ok" = "200" ] && [ "$hec_ok" = "200" ]; then
              echo "Splunk + HEC ready after ${i} attempts"
              exit 0
            fi
            echo "attempt $i: mgmt=$mgmt_ok hec=$hec_ok"
            sleep 5
          done
          echo "Splunk or HEC did not become ready"
          docker compose -f docker/compose.yml logs --tail 200
          exit 1

      - name: Ingest fixtures
        run: uv run python harness/ingest_fixtures.py

      - name: Debug — what landed in Splunk
        run: |
          AUTH="admin:${SPLUNK_PASSWORD}"
          run() {
            echo "--- $1 ---"
            curl -k -s -u "$AUTH" --max-time 60 \
              --data-urlencode "search=$2" \
              -d 'output_mode=json' -d 'exec_mode=oneshot' \
              'https://localhost:8089/services/search/jobs' | python -m json.tool || true
          }
          run "all events by sourcetype" 'search index=main earliest=-10y | stats count by sourcetype, host'
          run "WinEventLog 4624 events" 'search index=main sourcetype=WinEventLog:Security host=BSTOLL-L EventCode=4624 earliest=-10y | stats count'
          run "Native Logon_Type breakdown" 'search index=main sourcetype=WinEventLog:Security host=BSTOLL-L earliest=-10y | stats count by Logon_Type'
          run "Events with Logon Type string in _raw" 'search index=main sourcetype=WinEventLog:Security host=BSTOLL-L earliest=-10y | regex _raw="Logon Type" | stats count'
          run "Sample raw" 'search index=main sourcetype=WinEventLog:Security host=BSTOLL-L EventCode=4624 earliest=-10y | head 1 | table _raw'

      - name: Run hunts
        run: uv run python harness/run_hunts.py

      - name: Stop Splunk
        if: always()
        run: docker compose -f docker/compose.yml down -v
