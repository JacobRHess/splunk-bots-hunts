name: hunts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPLUNK_PASSWORD: Chang3me!
  SPLUNK_HEC_TOKEN: "00000000-0000-0000-0000-000000000000"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install deps
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check
      - name: mypy strict
        run: uv run mypy harness tools
      - name: pytest with coverage
        run: uv run pytest --cov-report=term-missing

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install deps
        run: uv sync --frozen

      - name: Start Splunk
        run: docker compose -f docker/compose.yml up -d

      - name: Wait for Splunk + HEC
        run: |
          for i in $(seq 1 90); do
            mgmt_ok=$(curl -k -s -o /dev/null -w '%{http_code}' "https://localhost:8089/services/server/info" -u "admin:${SPLUNK_PASSWORD}" || true)
            hec_ok=$(curl -k -s -o /dev/null -w '%{http_code}' "https://localhost:8088/services/collector/health" || true)
            if [ "$mgmt_ok" = "200" ] && [ "$hec_ok" = "200" ]; then
              echo "Splunk + HEC ready after ${i} attempts"
              exit 0
            fi
            echo "attempt $i: mgmt=$mgmt_ok hec=$hec_ok"
            sleep 5
          done
          echo "Splunk or HEC did not become ready"
          docker compose -f docker/compose.yml logs --tail 200
          exit 1

      - name: Ingest fixtures
        run: uv run python harness/ingest_fixtures.py

      - name: Run hunts
        run: uv run python harness/run_hunts.py

      - name: Run detections (assert fire / true-negative)
        run: uv run python harness/run_detections.py

      - name: Validate Splunk app loads (btool)
        run: |
          docker cp splunk_app/froth_bots_hunts splunk-bots:/opt/splunk/etc/apps/froth_bots_hunts
          docker exec splunk-bots /opt/splunk/bin/splunk btool savedsearches list \
            --app=froth_bots_hunts | tee /tmp/btool.out
          grep -q "\[BOTS - " /tmp/btool.out
          echo "Splunk parsed the app's savedsearches.conf"
          # The CIM, macro, and lookup conf must parse too, or the app installs broken.
          docker exec splunk-bots /opt/splunk/bin/splunk btool macros list \
            --app=froth_bots_hunts | grep -q "\[frothly_index\]"
          docker exec splunk-bots /opt/splunk/bin/splunk btool eventtypes list \
            --app=froth_bots_hunts | grep -q "\[frothly_aad_signin\]"
          docker exec splunk-bots /opt/splunk/bin/splunk btool tags list \
            --app=froth_bots_hunts | grep -q "authentication"
          docker exec splunk-bots /opt/splunk/bin/splunk btool transforms list \
            --app=froth_bots_hunts | grep -q "\[frothly_identities\]"
          echo "Splunk parsed the app's macros, eventtypes, tags, and transforms"

      - name: Stop Splunk
        if: always()
        run: docker compose -f docker/compose.yml down -v
