name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-deps:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install deps
        run: uv sync --frozen
      - name: bandit (Python SAST)
        run: uv run bandit -c pyproject.toml -r harness tools
      - name: pip-audit (dependency CVEs)
        run: uv run pip-audit --skip-editable

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      # gitleaks-action enumerates the PR's commits through the API on
      # pull_request events; without this it 403s ("not accessible by integration").
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (secret scan, history + tree)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actions-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: zizmor (GitHub Actions security audit)
        run: uvx zizmor@1.0.1 .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
