name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-deps:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Install deps
        run: uv sync --frozen
      - name: bandit (Python SAST)
        run: uv run bandit -c pyproject.toml -r harness tools
      - name: pip-audit (dependency CVEs)
        run: uv run pip-audit --skip-editable

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      # gitleaks-action enumerates the PR's commits through the API on
      # pull_request events; without this it 403s ("not accessible by integration").
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (secret scan, history + tree)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actions-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: zizmor (GitHub Actions security audit)
        run: uvx zizmor@1.0.1 .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
