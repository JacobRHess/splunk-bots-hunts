# Splunk's bundled extractions for WinEventLog:Security vary across versions
# and ship via different add-ons. These EXTRACT rules pin the fields our hunt
# SPL relies on, so the same fixture data extracts the same fields locally
# (Splunk 7.x) and in CI (Splunk 9.x).

[WinEventLog:Security]
EXTRACT-bh_Logon_Type = Logon Type:\s+(?<Logon_Type>\d+)
EXTRACT-bh_Source_Network_Address = Source Network Address:\s+(?<Source_Network_Address>\S+)
