[BOTS - Cryptomining pool DNS resolution]
description = An internal host resolved a known browser/CPU cryptomining pool domain. Cryptojacking is loud in DNS because the miner cannot start without resolving its pool, so a small known-pool list gives near-zero false positives. Fired on BSTOLL-L resolving coinhive.com plus its ws* nodes.
search = index=botsv3 sourcetype=stream:dns (query=*coinhive.com OR query=*minexmr.com OR query=*nanopool.org OR query=*xmrpool.* OR query=*cryptonight.*) | stats count dc(query) as distinct_fqdns values(query) as fqdns by src_ip
disabled = 0
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -60m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
action.notable = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = BOTS - Cryptomining pool DNS resolution
action.correlationsearch.annotations = {"mitre_attack":["T1496","T1071.001"]}
