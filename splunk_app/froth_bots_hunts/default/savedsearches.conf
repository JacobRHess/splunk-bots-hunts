[BOTS - Cryptomining pool DNS resolution]
description = A known browser/CPU cryptomining pool domain was resolved. Cryptojacking is loud in DNS because the miner cannot start without resolving its pool, so a small known-pool list gives near-zero false positives. Fired on the coinhive.com resolutions plus the ws* mining nodes. Tuning: Curated to a known-pool domain list, so false positives are rare; analysts researching mining sites can still trip it, so exclude security-team hosts.
search = index=botsv3 sourcetype=stream:dns (query="*coinhive.com" OR query="*minexmr.com" OR query="*nanopool.org" OR query="*xmrpool.*" OR query="*cryptonight.*") | stats count dc(query) as distinct_fqdns values(query) as fqdns
