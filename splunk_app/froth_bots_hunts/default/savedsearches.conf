[BOTS - AWS Console login without MFA (IAM user)]
description = An IAM user authenticated to the AWS Console without MFA. High-signal on its own; in this dataset it fired on the first of bstoll's four logins, before any S3 enumeration started.
search = index=botsv3 sourcetype=aws:cloudtrail eventName=ConsoleLogin additionalEventData.MFAUsed=No userIdentity.type=IAMUser | stats count min(_time) as firstTime values(sourceIPAddress) as src_ip by userIdentity.userName | rename userIdentity.userName as user
disabled = 0
enableSched = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
action.notable = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = BOTS - AWS Console login without MFA (IAM user)
action.correlationsearch.annotations = {"mitre_attack":["T1078.004"]}
request.ui_dispatch_app = froth_bots_hunts
