[BOTS - O365 file exposed by an anonymous sharing link]
description = A Frothly user created an anonymous (no-sign-in) sharing link to a file in OneDrive or SharePoint. Anonymous links make a file reachable by anyone who has the URL, so they are how an attacker either stages a payload for victims to pull or leaks a document outright. Fires on the bgist link to BRUCE BIRTHDAY HAPPY HOUR PICS.lnk, which six external IPs then retrieved. Tuning: Tenants that use anonymous links for collaboration will be noisy; scope to risky extensions (.lnk/.exe/.js) or external domains, or alert only on a user's first anonymous share.
search = index=botsv3 sourcetype=ms:o365:management Operation=AnonymousLinkCreated | stats count values(SourceFileName) as files by UserId, ClientIP
