[BOTS - Encoded or in-memory PowerShell execution]
description = A powershell.exe process whose command line decodes a base64 payload (FromBase64String) or runs an encoded command (-enc). Both are rare on a workstation and are the core of the FYODOR-L fileless implant.
search = index=botsv3 sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 Image=*powershell.exe (CommandLine=*FromBase64String* OR CommandLine=*-enc*) | stats count values(CommandLine) as cmdlines by Computer, User
disabled = 0
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -60m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
action.notable = 1
