[BOTS - PowerShell launched by the Task Scheduler (svchost)]
description = powershell.exe parented by svchost.exe almost always means a scheduled task launched it. On FYODOR-L this is the SYSTEM-context persistence that relaunches the implant via the Schedule service.
search = index=botsv3 sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 Image=*powershell.exe ParentImage=*svchost.exe | stats count by Computer, User, ParentCommandLine
